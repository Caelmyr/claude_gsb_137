<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户管理 · DFSVS</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="layout">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">用户管理</h1>
        <div class="sub" id="page-sub">账号 · 角色 · 会话（需要 admin 角色）</div>
      </div>
      <div class="spacer"></div>
      <button class="btn sm primary" id="btn-create">＋ 新建用户</button>
      <div class="userchip" id="userchip"></div>
    </header>

    <section class="content">
      <div id="no-perm" class="card" style="display:none">
        <div class="empty"><div class="big">🔒</div>当前账号没有用户管理权限（需要 admin 角色）</div>
      </div>

      <div id="main-pane">
        <div class="card">
          <div class="card-title">用户列表 <span class="hint" id="user-count"></span>
            <span class="spacer"></span>
            <button class="btn xs ghost" id="btn-refresh">⟳ 刷新</button>
          </div>
          <div class="table-wrap"><table class="tbl">
            <thead><tr>
              <th>用户</th><th>角色</th><th>邮箱</th><th>备注</th><th>状态</th>
              <th>创建时间</th><th>最近登录</th><th class="right">登录次数</th><th>操作</th>
            </tr></thead>
            <tbody id="user-body"></tbody>
          </table></div>
        </div>

        <div class="grid cols-2">
          <div class="card">
            <div class="card-title">角色能力矩阵</div>
            <div id="role-box"></div>
          </div>
          <div class="card">
            <div class="card-title">活动会话 <span class="hint">令牌尾 6 位</span>
              <span class="spacer"></span>
              <button class="btn xs danger" id="btn-revoke-all">吊销全部</button>
            </div>
            <div class="table-wrap scroll-y" style="max-height:300px"><table class="tbl">
              <thead><tr><th>用户</th><th>令牌</th><th>登录时间</th><th>过期时间</th><th>来源</th></tr></thead>
              <tbody id="sess-body"></tbody>
            </table></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<div id="toasts"></div>
<script src="js/app.js"></script>
<script>
"use strict";
const { api, esc, fmtTs, fmtAgo, toast, modal, confirmDlg, promptDlg } = DFSVS;

let canAdmin = false;
let roles = {};

const ROLE_BADGE = { admin: "bad", operator: "acc", viewer: "dim" };

async function loadUsers() {
  try {
    const d = await api("GET", "/api/users");
    roles = d.roles || {};
    document.getElementById("no-perm").style.display = "none";
    document.getElementById("main-pane").style.display = "";
    canAdmin = true;
    document.getElementById("user-count").textContent = d.users.length + " 个账号";
    renderUsers(d.users);
    renderRoles();
  } catch (e) {
    if (e.status === 403) {
      document.getElementById("no-perm").style.display = "";
      document.getElementById("main-pane").style.display = "none";
      document.getElementById("btn-create").style.display = "none";
    } else toast(e.message, "bad");
  }
}

function renderUsers(users) {
  document.getElementById("user-body").innerHTML = users.map(u => `
    <tr>
      <td><b>${esc(u.username)}</b>${u.username === "admin" ? ' <span class="badge dim plain">内置</span>' : ""}</td>
      <td><span class="badge ${ROLE_BADGE[u.role] || "dim"} plain">${esc((roles[u.role] || {}).label || u.role)}</span></td>
      <td class="small dim">${esc(u.email || "-")}</td>
      <td class="small dim">${esc(u.note || "-")}</td>
      <td>${u.status === "active" ? '<span class="badge ok plain">启用</span>' : '<span class="badge bad plain">停用</span>'}</td>
      <td class="small dim nowrap">${fmtTs(u.created_at)}</td>
      <td class="small dim nowrap">${u.last_login ? fmtAgo(u.last_login) : "从未"}</td>
      <td class="num right">${u.login_count || 0}</td>
      <td class="nowrap">
        <button class="btn xs u-edit" data-u='${esc(JSON.stringify(u))}'>✎ 编辑</button>
        <button class="btn xs u-reset" data-u="${esc(u.username)}">🔑 重置口令</button>
        ${u.username !== "admin" ? `<button class="btn xs danger u-del" data-u="${esc(u.username)}">删除</button>` : ""}
      </td>
    </tr>`).join("");
  bind(users);
}

function bind(users) {
  document.querySelectorAll(".u-edit").forEach(b => b.onclick = () => {
    const u = JSON.parse(b.dataset.u);
    editUser(u);
  });
  document.querySelectorAll(".u-reset").forEach(b => b.onclick = () => resetPw(b.dataset.u));
  document.querySelectorAll(".u-del").forEach(b => b.onclick = () => {
    confirmDlg(`删除用户 ${b.dataset.u}？其会话将被吊销。`, async () => {
      try { await api("DELETE", "/api/users/" + encodeURIComponent(b.dataset.u));
            toast("已删除", "ok"); loadUsers(); loadSessions(); }
      catch (e) { toast(e.message, "bad"); }
    }, true);
  });
}

function editUser(u) {
  promptDlg(`编辑用户 · ${u.username}`, [
    { name: "role", label: "角色", type: "select", value: u.role,
      options: Object.entries(roles).map(([k, v]) => ({ value: k, label: `${v.label}（${k}）` })) },
    { name: "email", label: "邮箱", value: u.email || "" },
    { name: "note", label: "备注", value: u.note || "" },
    { name: "status", label: "状态", type: "select", value: u.status,
      options: [{ value: "active", label: "启用" }, { value: "disabled", label: "停用" }] },
  ], async (v) => {
    try {
      await api("PUT", "/api/users/" + encodeURIComponent(u.username), v);
      toast("已更新", "ok");
      loadUsers();
    } catch (e) { toast(e.message, "bad"); }
  });
}

function resetPw(username) {
  promptDlg(`重置口令 · ${username}`, [
    { name: "password", label: "新口令（至少 6 位）", type: "password" },
  ], async (v) => {
    try {
      await api("PUT", "/api/users/" + encodeURIComponent(username), { password: v.password });
      toast("口令已重置，其活动会话建议吊销", "ok");
    } catch (e) { toast(e.message, "bad"); }
  });
}

document.getElementById("btn-create").onclick = () => {
  promptDlg("新建用户", [
    { name: "username", label: "用户名（2~32 位字母/数字/_/-）", placeholder: "dave" },
    { name: "password", label: "初始口令（至少 6 位）", type: "password" },
    { name: "role", label: "角色", type: "select",
      options: Object.entries(roles).map(([k, v]) => ({ value: k, label: `${v.label}（${k}）` })) },
    { name: "email", label: "邮箱", placeholder: "dave@dfsvs.local" },
    { name: "note", label: "备注" },
  ], async (v) => {
    try {
      await api("POST", "/api/users", v);
      toast(`用户 ${v.username} 已创建`, "ok");
      loadUsers();
    } catch (e) { toast(e.message, "bad"); }
  });
};

function renderRoles() {
  document.getElementById("role-box").innerHTML = `
    <table class="tbl">
      <thead><tr><th>角色</th><th>说明</th><th>能力位</th></tr></thead>
      <tbody>
      ${Object.entries(roles).map(([k, v]) => `
        <tr>
          <td><span class="badge ${ROLE_BADGE[k] || "dim"} plain">${esc(v.label)}</span>
              <div class="mono small muted">${esc(k)}</div></td>
          <td class="small dim">${esc(v.desc)}</td>
          <td>${v.caps.map(c => `<span class="chip">${esc(c)}</span>`).join(" ")}</td>
        </tr>`).join("")}
      </tbody>
    </table>
    <div class="small muted" style="margin-top:8px">
      能力位与路径 ACL 共同决定权限：先匹配 ACL 规则（优先级 + 最长前缀），
      未命中时回落到角色默认策略。详见「权限设置」页。</div>`;
}

async function loadSessions() {
  if (!canAdmin) return;
  try {
    const d = await api("GET", "/api/auth/sessions");
    const body = document.getElementById("sess-body");
    body.innerHTML = d.sessions.length ? d.sessions.map(s => `
      <tr>
        <td><b>${esc(s.username)}</b></td>
        <td class="mono small">…${esc(s.token_tail)}</td>
        <td class="small dim nowrap">${fmtTs(s.created)}</td>
        <td class="small dim nowrap">${fmtTs(s.expires)}</td>
        <td class="small dim">${esc(s.ip || "-")}</td>
      </tr>`).join("") : `<tr><td colspan="5" class="empty small">无活动会话</td></tr>`;
  } catch (e) { /* 403 时静默 */ }
}

document.getElementById("btn-revoke-all").onclick = () =>
  confirmDlg("吊销所有会话？所有人（包括你）需要重新登录。", async () => {
    try { const r = await api("POST", "/api/users/revoke_sessions", {});
          toast(`已吊销 ${r.revoked} 个会话`, "ok");
          setTimeout(() => DFSVS.logout(), 800); }
    catch (e) { toast(e.message, "bad"); }
  }, true);

document.getElementById("btn-refresh").onclick = () => { loadUsers(); loadSessions(); };

initPage("users.html", "用户管理").then(() => {
  loadUsers();
  loadSessions();
  DFSVS.poll(loadSessions, 8000);
});
</script>
</body>
</html>
